<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিওয়াইন স্টোর - Online Shop</title>
    <meta name="mobile-web-app-capable" content="Rwein Store">
    <meta name="apple-mobile-web-app-capable" content="Rwein Store">
    <meta name="apple-mobile-web-app-title" content="Rwein Store">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    
    </head>
<body>
<div class="page-wrapper">
    <div class="top-banner">
        <div class="logo-container">
            <div class="logo-text">Rwein Store</div>
        </div>
        <!-- User Authentication Top Bar Widget -->
        <div class="auth-bar" id="authBar">
            <button class="auth-btn" id="loginBtn" onclick="openAuthModal('login')">Login / Register</button>
            <div class="user-display" id="userDisplay" style="display: none;">
                <span id="userNameSpan">Customer</span>
                <button class="auth-btn" style="background:#e63946;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </div>

    <header>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by product name or code..." onkeyup="filterProducts()">
        </div>
        <div class="cart-icon-container" onclick="toggleCart()">
            🛒
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </header>

    <div class="category-bar">
        <button class="category-btn active" onclick="filterByCategory('All', this)">All</button>
        <button class="category-btn" onclick="filterByCategory('Accessories', this)">Accessories</button>
        <button class="category-btn" onclick="filterByCategory('Man', this)">Man</button>
        <button class="category-btn" onclick="filterByCategory('Woman', this)">Woman</button>
        <button class="category-btn" onclick="filterByCategory('Another', this)">Another</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Auth Modal (Registration & Login) -->
<div class="auth-modal" id="authModal">
    <div class="auth-content">
        <button style="position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer;" onclick="closeAuthModal()">&times;</button>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" class="auth-submit-btn">Login</button>
        </form>

        <!-- Registration Form (Collects Name, Phone, Email Verification) -->
        <form class="auth-form" id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="tel" id="regPhone" placeholder="Phone Number (For Contact)" required>
            <input type="email" id="regEmail" placeholder="Email Address" required>
            <input type="password" id="regPassword" placeholder="Password (Min 6 characters)" required minlength="6">
            <button type="submit" class="auth-submit-btn">Create Account & Send Verification Email</button>
        </form>

        <div class="auth-msg" id="authMsg"></div>
    </div>
</div>

<!-- Cart Drawer -->
<div class="cart-modal" id="cartModal">
    <div class="cart-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>Your Shopping Cart</h2>
            <button style="font-size: 1.5rem; border: none; background: none; cursor: pointer;" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cartItemsContainer"></div>
        <div class="checkout-section">
            <form class="customer-form" id="checkoutForm" onsubmit="sendOrder(event)">
                <h4>Customer Details</h4>
                <input type="text" id="custName" placeholder="Full Name" required>
                <input type="tel" id="custPhone" placeholder="Phone Number" required>
                <input type="email" id="custEmail" placeholder="Email Address" required>
                <textarea id="custAddress" placeholder="Delivery Address" rows="3" required></textarea>
                <button type="submit" class="add-to-cart-btn" style="background: var(--primary);">Submit Order via WhatsApp</button>
            </form>
        </div>
    </div>
        </div>
<script src="script.js"></script>
</body>
